# Tag-based deploy: pushing a version tag (vX.Y.Z) SSHes into the Oracle VM and
# runs update.sh for that EXACT tag, which checks it out and restarts services.
#
# Why tags (not every push to main)? AEVRIX is a single live always-on instance.
# Deploying should be a deliberate act, so main stays a free iteration branch and
# only a tag you create ships code. See docs/ORACLE_DEPLOYMENT.md "Push-to-deploy".
#
# IMPORTANT (honest caveats):
#   - The VM pulls the code itself via git; this job only triggers that over SSH.
#     No source is copied from the runner, so the VM stays the source of truth and
#     your .env / data/ are never touched.
#   - Requires four repository secrets (Settings -> Secrets and variables ->
#     Actions):
#       DEPLOY_SSH_HOST  - VM public IP or hostname
#       DEPLOY_SSH_USER  - the deploy user on the VM (e.g. "deploy")
#       DEPLOY_SSH_KEY   - the PRIVATE SSH key whose public half is on the VM
#       DEPLOY_SSH_PORT  - SSH port (optional; defaults to 22)
#   - The deploy user needs passwordless sudo for update.sh ONLY (sudoers snippet
#     in deploy/oracle/sudoers-deploy), because SSH sessions are non-interactive.

name: deploy

on:
  push:
    tags: ["v*"]
  # Escape hatch: deploy any ref (branch, tag, or commit SHA) on demand.
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to deploy on the VM (tag, branch, or commit SHA)"
        required: false
        default: ""

# Never run two deploys at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref to deploy
        id: ref
        # On a tag push, github.ref_name is the tag (e.g. v1.2.0).
        # On manual dispatch, use the typed input (may be empty = current branch).
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: "15m"
          script_stop: true
          script: |
            sudo /opt/aevrix/deploy/oracle/update.sh ${{ steps.ref.outputs.value }}

