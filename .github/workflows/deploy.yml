# Auto-deploy: every push to `main` SSHes into the Oracle VM and runs update.sh,
# which git-pulls the new code and restarts the services. You push to GitHub, the
# VM updates itself — no manual SSH needed.
#
# IMPORTANT (honest caveats):
#   - The VM pulls the code itself via git; this job only triggers that over SSH.
#     No source is copied from the runner, so the VM stays the source of truth and
#     your .env / data/ are never touched (they are gitignored).
#   - Requires four repository secrets (Settings -> Secrets and variables ->
#     Actions):
#       DEPLOY_SSH_HOST  - VM public IP or hostname
#       DEPLOY_SSH_USER  - the deploy user on the VM (e.g. "deploy")
#       DEPLOY_SSH_KEY   - the PRIVATE SSH key whose public half is on the VM
#       DEPLOY_SSH_PORT  - SSH port (optional; defaults to 22)
#   - The deploy user needs passwordless sudo for update.sh ONLY (sudoers snippet
#     in deploy/oracle/sudoers-deploy), because SSH sessions are non-interactive.
#   - Caveat you accepted: a broken commit on main restarts the live services
#     immediately. Use the manual-dispatch escape hatch to roll back to a known
#     good commit/tag if that happens.

name: deploy

on:
  push:
    branches: ["main"]
    # Don't redeploy for docs-only or unrelated changes (optional tidy-up).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Escape hatch / rollback: deploy any ref (branch, tag, or commit SHA) on demand.
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to deploy on the VM (branch, tag, or commit SHA; blank = main)"
        required: false
        default: ""

# Never run two deploys at once; let an in-flight deploy finish before the next.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref to deploy
        id: ref
        # On push, deploy the branch that was pushed (main).
        # On manual dispatch, use the typed input (blank = VM's current branch).
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: "15m"
          script_stop: true
          script: |
            sudo /usr/bin/bash /opt/aevrix/deploy/oracle/update.sh ${{ steps.ref.outputs.value }}

